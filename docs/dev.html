<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documentación — NovaEmu</title>
<meta name="description" content="Documentación técnica de NovaEmu: arquitectura, 24 técnicas de los grandes emuladores, research PS5/Xbox 2026, guía para PCs viejas, roadmap y lecciones del proceso.">
<link rel="stylesheet" href="./assets/site.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%2309090b'/><rect x='22' y='30' width='16' height='16' fill='%2310b981'/><rect x='62' y='30' width='16' height='16' fill='%2334d399'/><rect x='22' y='54' width='56' height='8' fill='%2310b981'/><rect x='32' y='70' width='36' height='8' fill='%2334d399'/></svg>">
</head>
<body>
<header class="site-header">
  <a class="brand" href="./index.html">Nova<b>Emu</b></a>
  <nav>
    <a href="./index.html">Inicio</a>
    <a href="./demo.html">Demo completa</a>
    <a href="./tests.html">Banco de pruebas</a>
    <a href="./dev.html" class="active">Docs</a>
    <a href="#" data-gh>GitHub ↗</a>
  </nav>
</header>

<main class="wrap">
  <section class="hero" style="padding:34px 0 10px;text-align:left">
    <h1 style="font-size:clamp(26px,4vw,38px)">Documen<span>tación</span></h1>
    <p class="lead" style="margin-bottom:0">Seis documentos técnicos con una regla común:
      <strong>nada se afirma sin fuente datada ni ruta verificada</strong>.</p>
  </section>

  <div class="doc-list" id="doclist" style="margin-top:22px"></div>
  <article class="panel md" id="content" style="padding:26px">Cargando…</article>
</main>

<footer>
  NovaEmu v1.0 · MIT · fuentes markdown originales en <code>docs/dev/</code>
  <br><a href="#" data-gh>Repositorio</a>
</footer>

<script type="module" src="https://cdn.jsdelivr.net/npm/marked@12.0.2/lib/marked.esm.js"></script>
<script type="module">
  import "./assets/site.js";
  import { marked } from "https://cdn.jsdelivr.net/npm/marked@12.0.2/lib/marked.esm.js";

  const DOCS = [
    { id: "ARQUITECTURA",      desc: "8 decisiones de diseño y su origen" },
    { id: "TECNICAS",          desc: "24 técnicas de los grandes, con rutas" },
    { id: "RESEARCH_PS5_XBOX", desc: "Matriz de emulación 2026, con fuentes" },
    { id: "GUIA_PC_VIEJAS",    desc: "Rutas honestas para hardware humilde" },
    { id: "ROADMAP",           desc: "v1.1 → v3.0 con verificación por escalón" },
    { id: "INFORME_FINAL",     desc: "7 lecciones (L1–L7) del proceso" },
  ];

  const list = document.getElementById("doclist");
  const content = document.getElementById("content");
  const current = () => new URLSearchParams(location.search).get("doc") ?? DOCS[0].id;

  function renderNav() {
    list.innerHTML = "";
    for (const d of DOCS) {
      const a = document.createElement("a");
      a.className = "btn" + (d.id === current() ? " primary" : "");
      a.href = "./dev.html?doc=" + d.id;
      a.textContent = d.id.replace(/_/g, " ");
      a.title = d.desc;
      list.appendChild(a);
    }
  }

  async function load() {
    renderNav();
    const id = current();
    const valid = DOCS.some((d) => d.id === id);
    if (!valid) {
      content.innerHTML = `<h2>Documento no encontrado</h2><p>Elige uno de la lista: ${DOCS.map((d) => `<a href="./dev.html?doc=${d.id}">${d.id}</a>`).join(" · ")}</p>`;
      return;
    }
    content.textContent = "Cargando " + id + "…";
    try {
      const res = await fetch("./dev/" + id + ".md");
      if (!res.ok) throw new Error(res.status);
      const md = await res.text();
      content.innerHTML = marked.parse(md);
      document.title = id + " — NovaEmu";
    } catch (e) {
      content.innerHTML = `<h2>No se pudo cargar ${id}.md</h2><p>Error: <code>${e}</code>.
        Puedes leer el fichero directamente <a href="./dev/${id}.md">aquí</a>.</p>`;
    }
  }
  load();
</script>
</body>
</html>
