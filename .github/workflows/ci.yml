name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar (C99, sin dependencias)
        run: make all demos
      - name: Suite de evaluación NE-E001..E012
        run: bash tests/run_evals.sh
      - name: Resumen de evals
        if: always()
        run: |
          cat build/evals_rows.tsv || true
      - name: Verificación de integridad de ROMs de test
        run: cd tests/roms && sha256sum -c SHA256SUMS
      - name: Artefactos de evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-evidence
          path: |
            build/evals_rows.tsv
            build/selftest.out
